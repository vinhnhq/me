<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tab icon, as a drawing that stays sharp at any size: white "VN" on a burgundy disc,
       matched to icon.png. The letters are strokes cut flat at the cap height and the baseline,
       not text, so no font is needed to draw them. -->
  <clipPath id="caps"><rect x="0" y="10.5" width="32" height="11.3"/></clipPath>
  <circle cx="16" cy="16" r="16" fill="#800020"/>
  <g clip-path="url(#caps)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="miter" stroke-miterlimit="10">
    <path d="M5.9 8.5 L10.6 21 L15.3 8.5"/>
    <path d="M18.9 24 V11.6 L25.2 20.7 V8"/>
  </g>
</svg>
